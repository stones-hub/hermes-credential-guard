[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-credential-guard"
version = "0.4.1"
description = "Hermes plugin: local credential boundary with approved HTTP header / env / stdin injection"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["credential_guard*"]
namespaces = true
exclude = ["tests*", "scripts*", "docs*"]
